[en.about]
heading = "About"
intro = "MAIR Lab is a research group at Huazhong University of Science and Technology studying multimodal intelligence across perception, generation, reasoning, and action."
paragraphs = [
  "Founded in 2025 at the School of Computer Science and Technology, Huazhong University of Science and Technology, **MAIR Lab**, led by **Associate Professor Zhiyuan Ma**, is dedicated to advancing the next generation of artificial intelligence through **Multimodal Intelligence, Physical Intelligence, and Scientific Intelligence**. We aim to build systems that go beyond understanding and generating information—AI that can **understand the world, act upon it, and ultimately discover the principles that govern it**, bridging digital intelligence with the physical world and scientific discovery.",
  "We focus on three core capabilities that lead toward real-world intelligence:",
  "* **Multimodal Intelligence** enables models to jointly understand language, vision, and other modalities, forming structured and generalizable representations of complex environments and providing the cognitive foundation for machines to comprehend the world.",
  "* **Physical Intelligence** takes intelligence from understanding to action, enabling systems to perceive their surroundings, reason about spatial relationships and physical constraints, and accomplish complex real-world tasks through reasoning, planning, interaction, and manipulation.",
  "* **Scientific Intelligence** moves AI beyond solving predefined problems toward discovering the unknown, enabling systems to participate in scientific reasoning, modeling, experimentation, and verification, and ultimately to help expand the frontier of human knowledge.",
  "These three capabilities are not isolated. Together, they form a progression from **understanding, to acting, to discovering**: **multimodal intelligence enables machines to understand the world, physical intelligence allows them to act in the world, and scientific intelligence empowers them to explain and discover how the world works.** Together, they point toward a single goal: building intelligent systems that are deeply grounded in complex real-world environments, capable of autonomous action, and able to continuously expand the boundaries of knowledge.",
  "Toward this vision, we conduct research across **data and evaluation, learning and alignment, and agentic and interactive systems**, spanning multimodal foundation models, AI agents, embodied intelligence, and AI for Science. Our work investigates the fundamental mechanisms of perception, reasoning, planning, action, and discovery across digital environments, the physical world, and scientific domains.",
  "We believe the next generation of AI will be defined not by model scale alone, but by how **perception, reasoning, action, and discovery come together within a unified intelligent system**. Our goal is to advance AI from **understanding information to interacting with environments, from reactive responses to autonomous action, and from solving existing problems to discovering new problems and underlying principles**."
]
focus_heading = "Research perspective"
focus_items = [
  "Connect understanding and generation within unified multimodal systems.",
  "Close the loop from perception and reasoning to interaction and action.",
  "Build scientifically grounded AI systems whose outputs remain useful and correct."
]

