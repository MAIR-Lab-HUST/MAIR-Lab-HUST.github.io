[zh.about]
heading = "关于我们"
intro = "MAIR 实验室隶属于华中科技大学，围绕感知、生成、推理与行动研究多模态智能。"
paragraphs = [
  "我们的研究连接多模态智能、物理智能与科学智能。我们不仅关注模型如何理解和生成信息，也关注模型如何形成可用于行动的环境表征，并进一步服务科学发现。",
  "围绕这些方向，实验室开展数据集与评测基准、学习与对齐方法、交互系统等研究，推动基础模型能力转化为面向复杂数字环境、物理世界与科学场景的可靠智能。"
]
