[zh.news]
heading = "实验室动态"

[zh.about]
heading = "关于我们"
intro = "MAIR 实验室隶属于华中科技大学，围绕感知、生成、推理与行动研究多模态智能。"
paragraphs = [
  "华中科技大学计算机学院 **MAIR 实验室**成立于 2025 年，由**马志远副教授**带领，致力于探索从**多模态智能（Multimodal Intelligence）**、**物理智能（Physical Intelligence）**到**科学智能（Scientific Intelligence）**的新一代人工智能。我们希望构建的不只是能够理解和生成信息的模型，而是能够**理解世界、作用于世界，并进一步发现世界规律**的智能系统，推动人工智能从数字空间走向物理世界与科学发现。",
  "我们聚焦通向真实世界智能的三类核心能力：",
  "* **多模态智能（Multimodal Intelligence）**赋予模型统一理解语言、视觉及其他模态信息的能力，使其能够在复杂环境中形成结构化、可泛化的世界表征，为机器理解世界奠定认知基础。",
  "* **物理智能（Physical Intelligence）**让智能从“理解”进一步走向“行动”，使模型能够感知环境、理解空间关系与物理规律，并通过推理、规划、交互与操作完成真实世界中的复杂任务。",
  "* **科学智能（Scientific Intelligence）**推动人工智能从解决既定问题迈向探索未知规律，使模型能够参与科学推理、建模、实验与验证，辅助知识发现，并不断拓展人类认识世界的边界。",
  "三者并非彼此孤立，而是构成一条从**理解、行动到发现**的能力链条：**多模态智能让机器理解世界，物理智能让机器作用于世界，科学智能让机器进一步解释世界并发现其内在规律。** 它们共同指向一个目标——构建真正扎根于复杂现实环境、具备自主行动能力，并能够持续拓展认知边界的智能系统。",
  "围绕这一愿景，我们从**数据与评测、学习与对齐、智能体与交互系统**等层面开展系统研究，覆盖多模态基础模型、Agent、具身智能与 AI for Science 等方向，探索机器在数字空间、物理世界与科学场景中的感知、推理、规划、行动与发现机制。",
  "我们相信，下一代人工智能的关键不只在于更大的模型规模，而在于**感知、推理、行动与发现能力如何在统一的智能系统中协同形成**。我们的目标，是推动人工智能从**信息理解走向环境交互，从被动响应走向自主行动，从解决问题走向发现问题与规律**。"
]
